name: Custom WebSSH Image

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref to build (for example v0.6.2, v0.7.0, or main)
        required: true
        default: v0.6.2
      image_tag:
        description: Tag for ghcr.io/<owner>/headplane:<tag>
        required: true
        default: 0.6.2-webssh
      platforms:
        description: Comma-separated Docker platforms
        required: true
        default: linux/amd64
      push_latest_webssh:
        description: Also push ghcr.io/<owner>/headplane:latest-webssh
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "17 3 1 */2 *"

concurrency:
  group: custom-webssh-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build and Push
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target version and build options
        id: target
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            source_ref='${{ inputs.source_ref }}'
            image_tag='${{ inputs.image_tag }}'
            platforms='${{ inputs.platforms }}'
            push_latest='${{ inputs.push_latest_webssh }}'
          else
            source_ref="$(
              curl -fsSL https://api.github.com/repos/tale/headplane/releases/latest \
                | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])'
            )"
            clean="${source_ref#v}"
            image_tag="${clean}-webssh"
            platforms='linux/amd64'
            push_latest='true'
          fi

          echo "source_ref=${source_ref}" >> "${GITHUB_OUTPUT}"
          echo "image_tag=${image_tag}" >> "${GITHUB_OUTPUT}"
          echo "platforms=${platforms}" >> "${GITHUB_OUTPUT}"
          echo "push_latest=${push_latest}" >> "${GITHUB_OUTPUT}"

      - name: Check out upstream source at selected ref
        uses: actions/checkout@v4
        with:
          repository: tale/headplane
          ref: ${{ steps.target.outputs.source_ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: prep
        shell: bash
        run: |
          set -euo pipefail
          base="ghcr.io/${GITHUB_REPOSITORY_OWNER}/headplane"
          image="${base}:${{ steps.target.outputs.image_tag }}"
          tags="${image}"

          if [[ "${{ steps.target.outputs.push_latest }}" == "true" ]]; then
            tags="${tags},${base}:latest-webssh"
          fi

          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "tags=${tags}" >> "${GITHUB_OUTPUT}"

      - name: Skip if image already exists (scheduled runs)
        id: exists
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.prep.outputs.image }}"
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "Image already exists: $image"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Apply WebSSH Dockerfile hotfix if needed
        if: ${{ steps.exists.outputs.exists != 'true' || github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '/run/app/hp_ssh.wasm' Dockerfile; then
            echo "Applying Dockerfile hotfix: /run/app -> /run/public for WebSSH assets"
            sed -i 's#/run/app/hp_ssh.wasm#/run/public/hp_ssh.wasm#g' Dockerfile
            sed -i 's#/run/app/wasm_exec.js#/run/public/wasm_exec.js#g' Dockerfile
          else
            echo "Hotfix not needed for this source_ref"
          fi

          grep -nE 'hp_ssh\\.wasm|wasm_exec\\.js' Dockerfile || true

      - name: Apply WebSSH prefix hotfix if needed
        if: ${{ steps.exists.outputs.exists != 'true' || github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f app/routes/ssh/console.tsx ]; then
            sed -i 's#const origin = new URL(request.url).origin;#const origin = `http://127.0.0.1:${context.config.server.port}`;#g' app/routes/ssh/console.tsx
            sed -i 's#const assets = \["/wasm_exec.js", "/hp_ssh.wasm"\];#const assets = [`${__PREFIX__}/wasm_exec.js`, `${__PREFIX__}/hp_ssh.wasm`];#g' app/routes/ssh/console.tsx
            sed -i 's#href: "/hp_ssh.wasm",#href: `${__PREFIX__}/hp_ssh.wasm`,#g' app/routes/ssh/console.tsx
            sed -i 's#src: "/wasm_exec.js",#src: `${__PREFIX__}/wasm_exec.js`,#g' app/routes/ssh/console.tsx
            sed -i 's#WebAssembly.instantiateStreaming(fetch("/hp_ssh.wasm"), go.importObject).then((value) => {#WebAssembly.instantiateStreaming(fetch(`${__PREFIX__}/hp_ssh.wasm`), go.importObject).then((value) => {#g' app/routes/ssh/console.tsx
          fi

          grep -nE 'const origin = |assets = |hp_ssh\\.wasm|wasm_exec\\.js' app/routes/ssh/console.tsx || true

      - name: Build and push
        if: ${{ steps.exists.outputs.exists != 'true' || github.event_name == 'workflow_dispatch' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: final
          push: true
          tags: ${{ steps.prep.outputs.tags }}
          platforms: ${{ steps.target.outputs.platforms }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            IMAGE_TAG=${{ steps.prep.outputs.image }}
            HEADPLANE_VERSION=${{ steps.target.outputs.source_ref }}

      - name: Usage
        shell: bash
        run: |
          {
            if [[ "${{ steps.exists.outputs.exists }}" == "true" && "${{ github.event_name }}" != "workflow_dispatch" ]]; then
              echo "No build needed. Image already exists:"
              echo ""
              echo "- ${{ steps.prep.outputs.image }}"
              exit 0
            fi

            echo "Built and pushed:"
            echo ""
            echo "- ${{ steps.prep.outputs.tags }}"
            echo ""
            echo "Pull on VPS:"
            echo ""
            echo "  docker pull ${{ steps.prep.outputs.image }}"
          } >> "${GITHUB_STEP_SUMMARY}"
