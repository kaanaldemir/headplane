name: Custom WebSSH Image

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref to build (for example v0.6.2, v0.7.0, or main)
        required: true
        default: v0.6.2
      image_tag:
        description: Tag for ghcr.io/<owner>/headplane:<tag>
        required: true
        default: 0.6.2-webssh
      platforms:
        description: Comma-separated Docker platforms
        required: true
        default: linux/amd64
      push_latest_webssh:
        description: Also push ghcr.io/<owner>/headplane:latest-webssh
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build and Push
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo at selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: prep
        shell: bash
        run: |
          set -euo pipefail
          base="ghcr.io/${GITHUB_REPOSITORY_OWNER}/headplane"
          image="${base}:${{ inputs.image_tag }}"
          tags="${image}"

          if [[ "${{ inputs.push_latest_webssh }}" == "true" ]]; then
            tags="${tags},${base}:latest-webssh"
          fi

          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "tags=${tags}" >> "${GITHUB_OUTPUT}"

      - name: Apply WebSSH Dockerfile hotfix if needed
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '/run/app/hp_ssh.wasm' Dockerfile; then
            echo "Applying Dockerfile hotfix: /run/app -> /run/public for WebSSH assets"
            sed -i 's#/run/app/hp_ssh.wasm#/run/public/hp_ssh.wasm#g' Dockerfile
            sed -i 's#/run/app/wasm_exec.js#/run/public/wasm_exec.js#g' Dockerfile
          else
            echo "Hotfix not needed for this source_ref"
          fi

          grep -nE 'hp_ssh\\.wasm|wasm_exec\\.js' Dockerfile || true

      - name: Apply WebSSH prefix hotfix if needed
        shell: bash
        run: |
          set -euo pipefail
          if [ -f app/routes/ssh/console.tsx ]; then
            sed -i 's#const origin = new URL(request.url).origin;#const origin = `http://127.0.0.1:${context.config.server.port}`;#g' app/routes/ssh/console.tsx
            sed -i 's#const assets = \["/wasm_exec.js", "/hp_ssh.wasm"\];#const assets = [`${__PREFIX__}/wasm_exec.js`, `${__PREFIX__}/hp_ssh.wasm`];#g' app/routes/ssh/console.tsx
            sed -i 's#href: "/hp_ssh.wasm",#href: `${__PREFIX__}/hp_ssh.wasm`,#g' app/routes/ssh/console.tsx
            sed -i 's#src: "/wasm_exec.js",#src: `${__PREFIX__}/wasm_exec.js`,#g' app/routes/ssh/console.tsx
            sed -i 's#WebAssembly.instantiateStreaming(fetch("/hp_ssh.wasm"), go.importObject).then((value) => {#WebAssembly.instantiateStreaming(fetch(`${__PREFIX__}/hp_ssh.wasm`), go.importObject).then((value) => {#g' app/routes/ssh/console.tsx
          fi

          grep -nE 'const origin = |assets = |hp_ssh\\.wasm|wasm_exec\\.js' app/routes/ssh/console.tsx || true

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: final
          push: true
          tags: ${{ steps.prep.outputs.tags }}
          platforms: ${{ inputs.platforms }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            IMAGE_TAG=${{ steps.prep.outputs.image }}
            HEADPLANE_VERSION=${{ inputs.source_ref }}

      - name: Usage
        shell: bash
        run: |
          {
            echo "Built and pushed:"
            echo ""
            echo "- ${{ steps.prep.outputs.tags }}"
            echo ""
            echo "Pull on VPS:"
            echo ""
            echo "  docker pull ${{ steps.prep.outputs.image }}"
          } >> "${GITHUB_STEP_SUMMARY}"
